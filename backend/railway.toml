# railway.toml
# Railway reads this file to know how to build and run your backend.
# Place this file in the backend/ directory.
#
# Why Railway for backend:
#   - Free tier includes 500 hours/month
#   - Detects Node.js automatically without extra config
#   - Supports running two services from same repo (backend + worker)
#   - Has a built-in Redis service you can attach
#
# In Railway dashboard:
#   1. Create new project
#   2. Add service → GitHub repo → select your repo
#   3. Set root directory to "backend"
#   4. Railway picks up this config automatically
#   5. Add all environment variables from backend/.env

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "reposcan-backend"
