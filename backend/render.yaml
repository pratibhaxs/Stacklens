# backend/render.yaml
# Single Web Service for Render free tier.
# Runs server + worker together in one process.

services:
  - type: web
    name: reposcan-backend
    env: docker
    dockerfilePath: ./Dockerfile
    # Override CMD to use combined server+worker entry point
    dockerCommand: node src/server-with-worker.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
